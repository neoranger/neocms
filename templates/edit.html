{% extends "base.html" %}

{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Editor Pro - NeoCMS</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Contenedor principal que limita la altura */
        .editor-workspace {
            display: flex;
            flex-direction: column;
            height: 85vh; /* Ocupa el 85% de la altura de la pantalla */
            margin-top: 10px;
        }

        /* Barra de Herramientas */
        .toolbar {
            flex-shrink: 0; /* No dejes que esto se achique */
            background: #1f1f1f;
            padding: 10px 15px;
            border-radius: 8px 8px 0 0;
            border: 1px solid #333;
            border-bottom: none;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .meta-input {
            background: #111;
            border: 1px solid #444;
            color: white;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .title-input {
            flex-grow: 1;
            font-size: 1.2rem;
            font-weight: bold;
            background: transparent;
            border: none;
            color: white;
            border-bottom: 1px solid #444;
        }
        .title-input:focus { outline: none; border-color: #0070f3; }

        /* GRID PRINCIPAL */
        .editor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex-grow: 1; /* Ocupa todo el espacio restante */
            min-height: 0; /* <--- TRUCO IMPORTANTE: Permite que el scroll funcione */
            border: 1px solid #333;
            border-radius: 0 0 8px 8px;
            background: #161616;
            overflow: hidden; /* Corta lo que sobre */
        }

        /* Área de escritura y preview */
        textarea#markdown-input, #preview {
            width: 100%;
            height: 100%; /* Altura total del padre */
            padding: 20px;
            border: none;
            overflow-y: auto; /* Scroll independiente */
            resize: none;
            box-sizing: border-box;
        }

        textarea#markdown-input {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 1rem;
            line-height: 1.6;
            border-right: 1px solid #333;
        }

        #preview {
            background: #111;
            color: #ccc;
        }
        
        /* Imágenes dentro del preview */
        #preview img { max-width: 100%; height: auto; border-radius: 5px; }

        /* Botones */
        .btn-action {
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 4px;
            border: none;
            font-size: 0.9rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn-save { background: #0070f3; color: white; }
        .btn-save:hover { background: #005bb5; }
        .btn-upload { background: #333; color: white; border: 1px solid #555; }
        .btn-upload:hover { background: #444; }
        
        @media (max-width: 768px) {
            .editor-workspace { height: auto; min-height: 100vh; }
            .editor-grid { grid-template-columns: 1fr; min-height: 800px; }
            textarea#markdown-input, #preview { height: 400px; }
        }
    </style>
{% endblock %}

{% block content %}
    
    <div style="margin-bottom: 10px;">
        <a href="{{ url_for('admin_list') }}" style="color: #888; text-decoration: none;">← Volver al Admin</a>
    </div>

    <form method="POST" class="editor-workspace">
        
        <div class="toolbar">
            <input type="text" name="title" value="{{ post.title }}" placeholder="Título del Post..." required class="title-input">
            
            <select name="status" class="meta-input" style="color: {{ '#4ade80' if post.status == 'published' else '#fbbf24' }}">
                <option value="published" {% if post.status == 'published' %}selected{% endif %}>🚀 Público</option>
                <option value="draft" {% if post.status == 'draft' %}selected{% endif %}>📝 Borrador</option>
            </select>

            <button type="button" class="btn-action btn-upload" onclick="document.getElementById('file-uploader').click()">
                📷 Media
            </button>
            <button type="submit" class="btn-action btn-save">
                💾 Guardar
            </button>
        </div>
        
        <div style="background: #1a1a1a; padding: 5px 15px; border-left: 1px solid #333; border-right: 1px solid #333; display: flex; gap: 10px; font-size: 0.8rem;">
            <input type="date" name="date" value="{{ post.date }}" class="meta-input">
            <input type="text" name="category" value="{{ post.category }}" placeholder="Categoría" class="meta-input">
            <input type="text" name="tags" value="{{ post.tags }}" placeholder="Tags (separados por coma)" class="meta-input" style="flex-grow: 1;">
            <input type="text" name="description" value="{{ post.description }}" placeholder="Descripción SEO..." class="meta-input" style="flex-grow: 1;">
        </div>

        <div class="editor-grid">
            <textarea name="content" id="markdown-input" placeholder="Escribe aquí...">{{ post.content }}</textarea>
            <div id="preview" class="prose"></div>
        </div>

        <input type="file" id="file-uploader" style="display: none;">
        <span id="upload-status" style="position: fixed; bottom: 10px; right: 10px; background: #333; padding: 5px 10px; border-radius: 5px; font-size: 0.8rem; display: none;"></span>

    </form>  

    <script>
        const input = document.getElementById('markdown-input');
        const preview = document.getElementById('preview');

        // Renderizado
        function updatePreview() {
            preview.innerHTML = marked.parse(input.value);
        }
        input.addEventListener('input', updatePreview);
        updatePreview();

        // Scroll Sincronizado (Opcional: Si quieres que al bajar uno baje el otro)
        /*
        input.addEventListener('scroll', () => {
             const percent = input.scrollTop / (input.scrollHeight - input.clientHeight);
             preview.scrollTop = percent * (preview.scrollHeight - preview.clientHeight);
        });
        */

        // Lógica de Upload
        const fileUploader = document.getElementById('file-uploader');
        const status = document.getElementById('upload-status');

        fileUploader.addEventListener('change', async () => {
            const file = fileUploader.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);
            
            status.style.display = 'block';
            status.innerText = "Subiendo...";

            try {
                const response = await fetch('/admin/upload', { method: 'POST', body: formData });
                const data = await response.json();

                if (response.ok) {
                    let code = `![img](${data.url})`;
                    if (file.type.includes('audio')) code = `<audio controls src="${data.url}"></audio>`;
                    if (file.type.includes('video')) code = `<video controls width="100%" src="${data.url}"></video>`;

                    // Insertar en cursor
                    const startPos = input.selectionStart;
                    const endPos = input.selectionEnd;
                    input.value = input.value.substring(0, startPos) + "\n" + code + "\n" + input.value.substring(endPos);
                    
                    status.innerText = "✅ Listo";
                    setTimeout(() => status.style.display = 'none', 2000);
                    updatePreview();
                } else {
                    status.innerText = "Error";
                }
            } catch (err) { console.error(err); }
        });
    </script>
{% endblock %}
