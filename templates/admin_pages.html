{% extends "base.html" %}{% block title %}Páginas | Admin{% endblock %}{% block content %}
<div style="display:flex;justify-content:space-between;align-items:center;margin:20px 0"><h2>Páginas</h2><div><a class="btn" href="{{ url_for('edit_page') }}">+ Nueva página</a> <a class="btn btn-secondary" href="{{ url_for('admin_list') }}">Dashboard</a></div></div>
<table><thead><tr><th>Título</th><th>Slug</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>
{% for p in pages %}<tr><td>{{ p.title }}</td><td>/p/{{ p.slug }}</td><td>{{ p.status }}</td>
<td><a href="{{ url_for('edit_page', slug=p.slug) }}">Editar</a> | <a href="/p/{{ p.slug }}" target="_blank">Ver</a>
<form action="{{ url_for('delete_page', slug=p.slug) }}" method="POST" style="display:inline" onsubmit="return confirm('Eliminar?')"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button style="background:none;border:none;color:var(--danger);cursor:pointer">Eliminar</button></form></td></tr>
{% else %}<tr><td colspan="4">Sin páginas.</td></tr>{% endfor %}
</tbody></table>{% endblock %}
